repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Only the package: research/ is analysis code, reviewed separately.
        files: ^src/fast_lto/
        additional_dependencies:
          # numpy 2.5 needs Python >= 3.12 and writes PEP 695 stubs that mypy
          # rejects while targeting 3.10. Match what a 3.10 install resolves.
          - numpy>=2.0.0,<2.5
          - types-PyYAML>=6.0.0

  # The fast subset, so a commit stays quick. CI runs the full sweep including
  # the golden solves marked `slow`.
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (excluding slow solves)
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD keeps ambient plugins (a sourced ROS
        # install, for one) from breaking collection; MPLBACKEND keeps the
        # figure tests headless.
        entry: env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 MPLBACKEND=Agg pytest -q -m "not slow"
        language: system
        pass_filenames: false
        types: [python]
