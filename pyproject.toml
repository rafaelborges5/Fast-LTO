[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-lto"
version = "0.1.0"
description = "Proof-of-concept Lap Time Optimisation (LTO) planner for Formula Student Driverless."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rafael", email = "you@example.com" }]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "casadi>=3.6.0",
    "hydra-core>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true


