[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-lto"
version = "0.1.0"
description = "Minimum-time trajectory optimisation for Formula Student Driverless."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Borges", email = "rafaelborg640@gmail.com" }]
keywords = [
    "formula-student",
    "autonomous-racing",
    "trajectory-optimization",
    "optimal-control",
    "casadi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "casadi>=3.6.0",
]

[project.urls]
Source = "https://github.com/rafaelborges5/Fast-LTO"
Issues = "https://github.com/rafaelborges5/Fast-LTO/issues"

[project.scripts]
fast-lto = "fast_lto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fast_lto*"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "types-PyYAML>=6.0.0",
]

# Extras the research/ scripts need, which the library itself does not.
research = [
    "plotly>=5.20.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Analysis entry points must select a headless matplotlib backend, or set
# thread-count env vars for the solver, before importing anything that reads
# them -- so imports legitimately follow a statement here.
"research/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: a solve heavy enough to be worth skipping locally (`pytest -m 'not slow'`)",
]

[tool.coverage.run]
source = ["fast_lto"]
branch = true
# research/ is outside the package, so it is already out of scope: coverage
# reports on what `pip install fast-lto` actually delivers.

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def _demo",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# Required everywhere now, rather than opted into module by module. The
# previous per-module allowlist existed because the flag had been claimed
# repo-wide before and never held; the count is zero, so it holds.
disallow_untyped_defs = true


