[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-lto"
version = "0.1.0"
description = "Proof-of-concept Lap Time Optimisation (LTO) planner for Formula Student Driverless."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rafael", email = "you@example.com" }]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "casadi>=3.6.0",
    "hydra-core>=1.3.0",
]

[project.scripts]
fast-lto = "fast_lto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fast_lto*"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Analysis entry points must select a headless matplotlib backend, or set
# thread-count env vars for the solver, before importing anything that reads
# them -- so imports legitimately follow a statement here.
"src/fast_lto/experiments/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# Annotations are not yet required repo-wide: requiring them everywhere was
# claimed before but never held (90 violations). The modules listed below are
# fully annotated today and are held to it, so the strict set only grows.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "fast_lto.export.*",
    "fast_lto.splines.discretized_track",
    "fast_lto.tracks.*",
    "fast_lto.utils.corridor",
    "fast_lto.vehicle_models.dynamic_bicycle",
    "fast_lto.vehicle_models.point_mass",
    "fast_lto.vehicle_models.vehicle_base",
    "fast_lto.visualization.skidpad_plots",
    "fast_lto.visualization.track_viewer",
]
disallow_untyped_defs = true


