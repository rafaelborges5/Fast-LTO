    B_fl: 9.0
    C_fl: 1.3
    D_fl: 1.1
    B_fr: 9.0
    C_fr: 1.3
    D_fr: 1.1
    B_rr: 9.0
    C_rr: 1.3
    D_rr: 1.2
    B_rl: 9.0
    C_rl: 1.3
    D_rl: 1.2

    Fx_max: 1500.0          # N
    dFxmax: 1000.0          # N/s
    delta_max: 0.4          # rad
    ddeltamax: 1.3          # rad/s

    load_transfer_mode: current_quasistatic

    a_long_max: null        # m/s^2
    a_lat_max: null         # m/s^2
