extends: vehicle.yaml

pipeline:
  ds_m: 0.5
  continuity: C2
  smooth_centerline: 5      # samples, 0 = off

  mode: trackdrive

  model_name: four_wheel
  integrator_name: euler

  reg_u: 0.0
  reg_u_l2: 0.0005

  boundary_margin: 0.45     # m per side
  initial_speed: 5.0        # m/s

  warm_start: auto
