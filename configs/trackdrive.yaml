# trackdrive: the car from vehicle.yaml, plus what this event tunes.

extends: vehicle.yaml

vehicle:
  corners:
  - [FL, 1.809, 0.75]
  - [FR, 1.809, -0.75]
  - [RL, -0.85, 0.63]
  - [RR, -0.85, -0.63]
  four_wheel:
    C_l: 5.54
    D_fl: 1.1
    D_fr: 1.1
    D_rl: 1.2
    D_rr: 1.2
    dFxmax: 1000.0
    rho: 1.225
  v_max: 25.0

pipeline:
  ds_m: 0.5
  continuity: C2
  smooth_centerline: 5
  mode: trackdrive
  model_name: four_wheel
  integrator_name: euler
  reg_u: 0.0
  reg_u_l2: 0.0005
  initial_speed: 5.0
  boundary_margin: 0.45
  warm_start: auto
