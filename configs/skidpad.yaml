extends: vehicle.yaml

vehicle:
  v_max: 14.0               # m/s
  four_wheel:
    rho: 1.115              # kg/m^3
    D_fl: 1.3
    D_fr: 1.3
    D_rr: 1.3
    D_rl: 1.3
    dFxmax: 2000.0          # N/s

pipeline:
  track_id: skidpad
  track_type: skidpad
  ds_m: 0.5
  continuity: C2

  mode: skidpad

  model_name: four_wheel
  integrator_name: euler

  reg_u: 0.0
  reg_u_l2: 0.0055

  boundary_margin: 0.50     # m per side
  initial_speed: 2.0        # m/s

  skidpad:
    map_csv: data/tracks/skidpad/skidpad_map.csv
    reference_csv: data/tracks/skidpad/skidpad_reference.csv

    entry_exit_halfwidth: 1.5   # m
    kappa_blend_m: 1.5
    start_x: 0.0            # m
    start_y: 0.0            # m

    lead_in_m: 10.0

    eps_time: 0.005
    decel_hold_m: 4.0
    terminal_speed: 1.0     # m/s
    terminal_straight_m: 5.0
