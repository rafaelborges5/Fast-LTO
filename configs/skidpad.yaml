# skidpad: the car from vehicle.yaml, plus what this event tunes.

extends: vehicle.yaml

vehicle:
  corners:
  - [FL, 1.809, 0.75]
  - [FR, 1.809, -0.75]
  - [RL, -0.85, 0.63]
  - [RR, -0.85, -0.63]
  four_wheel:
    C_l: 5.54
    D_fl: 1.3
    D_fr: 1.3
    D_rl: 1.3
    D_rr: 1.3
    dFxmax: 2000.0
    rho: 1.115
  v_max: 14.0

pipeline:
  track_id: skidpad
  track_type: skidpad
  ds_m: 0.5
  continuity: C2
  mode: skidpad
  model_name: four_wheel
  integrator_name: euler
  reg_u: 0.0
  reg_u_l2: 0.0055
  initial_speed: 2.0
  boundary_margin: 0.5
  skidpad_map_csv: data/tracks/skidpad/skidpad_map.csv
  skidpad_reference_csv: data/tracks/skidpad/skidpad_reference.csv
  eps_time: 0.005
  entry_exit_halfwidth: 1.5
  kappa_blend_m: 1.5
  terminal_speed: 1.0
  decel_hold_m: 4.0
  skidpad_start_x: 0.0
  skidpad_start_y: 0.0
  skidpad_lead_in_m: 10.0
  skidpad_terminal_straight_m: 5.0
