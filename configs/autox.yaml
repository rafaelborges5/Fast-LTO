# autox: the car from vehicle.yaml, plus what this event tunes.

extends: vehicle.yaml

vehicle:
  corners:
  - [FL, 1.73, 0.75]
  - [FR, 1.73, -0.75]
  - [RL, -0.85, 0.63]
  - [RR, -0.85, -0.63]
  four_wheel:
    C_l: 4.0
    D_fl: 1.15
    D_fr: 1.15
    D_rl: 1.25
    D_rr: 1.25
    dFxmax: 2000.0
    rho: 1.115
  v_max: 22.0

pipeline:
  ds_m: 0.5
  continuity: C2
  smooth_centerline: 9
  mode: autox
  model_name: four_wheel
  integrator_name: euler
  reg_u: 0.0
  reg_u_l2: 0.001
  initial_speed: 3.0
  boundary_margin: 0.45
  warm_start: auto
  autox:
    extension_m: 20.0
    start_x: 0.0
    start_y: 0.0
    start_node_offset: 1
    lead_in_m: 8.0
    ocp_lead_m: 0.0
    terminal_speed: 1.3
    eps_time: 0.05
    decel_hold_m: 0.0
    terminal_state_constraint: true
    terminal_window_nodes: 2
    terminal_pad_m: 10.0
    D_safe_braking: 1.075
