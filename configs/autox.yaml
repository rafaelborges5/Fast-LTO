extends: vehicle.yaml

vehicle:
  v_max: 22.0               # m/s
  four_wheel:
    rho: 1.115              # kg/m^3
    C_l: 4.00
    D_fl: 1.15
    D_fr: 1.15
    D_rr: 1.25
    D_rl: 1.25
    dFxmax: 2000.0          # N/s

pipeline:
  ds_m: 0.5
  continuity: C2
  smooth_centerline: 9      # samples, 0 = off

  mode: autox

  model_name: four_wheel
  integrator_name: euler

  reg_u: 0.0
  reg_u_l2: 0.001

  boundary_margin: 0.45     # m per side
  initial_speed: 3.0        # m/s

  warm_start: auto

  autox:
    start_x: 0.0            # m
    start_y: 0.0            # m
    start_node_offset: 1    # nodes

    lead_in_m: 8.0
    ocp_lead_m: 0.0

    extension_m: 20.0
    eps_time: 0.05
    decel_hold_m: 0.0

    terminal_speed: 1.3     # m/s
    terminal_state_constraint: true
    terminal_window_nodes: 2
    terminal_pad_m: 10.0
    D_safe_braking: 1.075
