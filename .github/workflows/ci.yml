name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Several modules import pyplot at import time.
  MPLBACKEND: Agg

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: isort --check-only .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      # The full suite, including the `slow` golden solves a local run skips.
      - name: Run the suite
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  install:
    name: Install from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build

      # A bare venv away from the source tree, so a missing package or an
      # undeclared dependency shows up here. It solves a real lap because the
      # interesting failure is where the outputs land: with no checkout to
      # find, they belong under the working directory, not in site-packages.
      - name: Install the wheel into a clean environment and solve a lap
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl
          mkdir -p /tmp/run-here && cd /tmp/run-here
          /tmp/wheel-env/bin/fast-lto --help > /dev/null
          /tmp/wheel-env/bin/fast-lto \
            --track-type ellipse --track-id ellipse --ds 3.0 \
            --model point_mass --no-warm-start --no-plot
          test -f data/solutions/ellipse_point_mass_euler_trackdrive.json \
            || { echo "installed run did not write into the working directory"; exit 1; }
          echo "installed wheel solved a lap and wrote to \$(pwd)"
