name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep matplotlib headless; several modules import pyplot at import time.
  MPLBACKEND: Agg

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: isort --check-only .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      # The golden solves are the safety net, so the full suite runs here --
      # including the cases marked `slow`, which a local `-m "not slow"` skips.
      - name: Run the suite
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  types:
    name: Types (advisory)
    runs-on: ubuntu-latest
    # Not blocking yet: mypy currently reports errors that Phase 5 of the
    # open-source cleanup clears (the Optional-field cleanup retires most of
    # them at once). Flip `continue-on-error` off in that phase -- the job is
    # here now so the count is visible on every PR and cannot grow unnoticed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  install:
    name: Install from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build

      # A wheel that imports is the minimum promise `pip install fast-lto`
      # makes. Installed into a bare venv, away from the source tree, so a
      # missing package or an undeclared dependency shows up here rather than
      # in someone else's terminal.
      - name: Install the wheel into a clean environment and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import fast_lto; print(fast_lto.__name__, 'ok')"
          /tmp/wheel-env/bin/fast-lto --help > /dev/null
